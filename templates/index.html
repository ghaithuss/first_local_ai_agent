<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JaRvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --panel:#F8FAFB; --ink:#13222C; --muted:#5D7280;
  --line:#CBD6DD; --accent:#1F4FFF; --accent-ink:#fff; --user:#13222C; --user-ink:#F2F6F8;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0F1A22; --panel:#16252F; --ink:#E7EEF2; --muted:#8CA1AE;
        --line:#26394555; --accent:#5B84FF; --accent-ink:#0F1A22; --user:#2A4152; --user-ink:#F2F6F8;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;line-height:1.6}
header{display:flex;align-items:center;gap:14px;padding:18px 24px;max-width:820px;width:100%;margin:0 auto}
.core{width:44px;height:44px;color:var(--accent);flex:none}
.core svg,.avatar svg{width:100%;height:100%;display:block}
.core.busy{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 0 transparent)}
  50%{transform:translateY(-3px);filter:drop-shadow(0 4px 6px color-mix(in srgb,var(--accent) 50%,transparent))}}
.avatar{width:28px;height:28px;color:var(--accent);flex:none;margin-top:-2px}
h1{font-size:1.35rem;font-weight:700;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.82rem}
.spacer{flex:1}
#reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;
  padding:7px 12px;font:inherit;font-size:.8rem;cursor:pointer}
#reset:hover{color:var(--ink);border-color:var(--muted)}
main{flex:1;overflow-y:auto;padding:0 24px}
#log{max-width:820px;margin:0 auto;padding:8px 0 24px;display:flex;flex-direction:column;gap:20px}
.msg{max-width:88%;font-size:.95rem;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);padding:10px 16px;border-radius:18px 18px 4px 18px}
.msg.bot{align-self:flex-start;display:flex;gap:12px}
.msg.bot .txt{padding-top:2px}
.msg.err .txt{color:#C0392B}
.msg a{color:var(--accent)}
.msg code{background:var(--panel);padding:1px 6px;border-radius:5px;font-size:.88em}
.empty{text-align:left;padding:8vh 0 0}
.empty h2{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:600;margin:0 0 8px;line-height:1.2}
.empty p{color:var(--muted);margin:0 0 22px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:9px 16px;font:inherit;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.confirm-url{margin:6px 0 0;color:var(--muted);font-size:.85rem}
.confirm-actions{display:flex;gap:10px;margin-top:12px}
.confirm-actions button{border:1px solid var(--line);border-radius:9px;padding:8px 18px;font:inherit;cursor:pointer}
.confirm-yes{background:var(--accent);color:var(--accent-ink)}
.confirm-no{background:var(--panel);color:var(--ink)}
.confirm-actions button:disabled{opacity:.5;cursor:default}
footer{padding:12px 24px 22px}
.composer{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 18px}
.composer:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;
  resize:none;max-height:160px;padding:8px 0}
textarea::placeholder{color:var(--muted)}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;width:42px;height:42px;
  font-size:1.1rem;cursor:pointer;flex:none}
#send:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.core.busy{animation:none}}
@media (max-width:520px){header,main,footer{padding-left:14px;padding-right:14px}.msg{max-width:96%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="robot" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="8" x2="16" y2="4"/>
    <circle cx="16" cy="3.2" r="1.6" fill="currentColor"/>
    <rect x="5" y="8" width="22" height="18" rx="6" fill="var(--panel)"/>
    <rect x="1.5" y="14" width="3.5" height="6" rx="1.5" fill="currentColor"/>
    <rect x="27" y="14" width="3.5" height="6" rx="1.5" fill="currentColor"/>
    <circle cx="12" cy="16" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="20" cy="16" r="2.2" fill="currentColor" stroke="none"/>
    <path d="M12 21.5h8"/>
  </symbol>
</svg>
<header>
  <div class="core" id="core"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#robot"/></svg></div>
  <div><h1>JaRvis</h1><div class="sub" id="status">Ready</div></div>
  <div class="spacer"></div>
  <button id="reset" type="button">New chat</button>
</header>

<main id="scroll">
  <div id="log">
    <div class="empty" id="empty">
      <h2>What can I do for you?</h2>
      <p>Ask me anything. I can check the weather, search the web, and open websites for you.</p>
      <div class="chips">
        <button class="chip" type="button">What's the weather in Tunis?</button>
        <button class="chip" type="button">Search for the best gaming PCs in 2026</button>
        <button class="chip" type="button">Open the Mytek Tunisia website</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message JaRvis" autofocus></textarea>
    <button id="send" type="button" aria-label="Send">&#10148;</button>
  </div>
</footer>

<script>
const log = document.getElementById("log");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const core = document.getElementById("core");
const statusEl = document.getElementById("status");
let busy = false;

function render(text){
  const s = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return s
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g,"<br>");
}

function addMsg(role, text, isErr){
  const el = document.getElementById("empty");
  if (el) el.remove();
  const d = document.createElement("div");
  d.className = "msg " + role + (isErr ? " err" : "");
  if (role === "user") d.textContent = text;
  else d.innerHTML = '<span class="avatar"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#robot"/></svg></span><div class="txt">' + render(text) + "</div>";
  log.appendChild(d);
  scroller.scrollTop = scroller.scrollHeight;
  return d;
}

async function confirmOpen(answer, buttons){
  buttons.forEach(b => b.disabled = true);
  try{
    const r = await fetch("/confirm-open", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({answer})
    });
    const data = await r.json();
    addMsg("bot", data.reply || "No response received.", !r.ok);
  }catch(e){
    addMsg("bot", "Could not confirm the website action.", true);
  }
}

function addConfirmation(url){
  const message = addMsg("bot", "Do you want me to open this website?");
  const text = message.querySelector(".txt");

  const link = document.createElement("p");
  link.className = "confirm-url";
  link.textContent = url;
  text.appendChild(link);

  const actions = document.createElement("div");
  actions.className = "confirm-actions";

  const yesButton = document.createElement("button");
  yesButton.type = "button";
  yesButton.textContent = "Yes";
  yesButton.className = "confirm-yes";

  const noButton = document.createElement("button");
  noButton.type = "button";
  noButton.textContent = "No";
  noButton.className = "confirm-no";

  actions.append(yesButton, noButton);
  text.appendChild(actions);

  yesButton.addEventListener("click", () => confirmOpen("y", [yesButton, noButton]));
  noButton.addEventListener("click", () => confirmOpen("n", [yesButton, noButton]));
}

function setBusy(b){
  busy = b;
  sendBtn.disabled = b;
  core.classList.toggle("busy", b);
  statusEl.textContent = b ? "Thinking..." : "Ready";
}

async function send(text){
  text = text.trim();
  if (!text || busy) return;
  addMsg("user", text);
  input.value = ""; input.style.height = "auto";
  setBusy(true);
  try{
    const r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text})});
    const data = await r.json();

    if (r.ok && data.reply.startsWith("CONFIRM_OPEN:")) {
      addConfirmation(data.reply.substring("CONFIRM_OPEN:".length));
    } else {
      addMsg("bot", data.reply || "No response received.", !r.ok);
    }
  }catch(e){
    console.error(e);
    addMsg("bot", "Error: " + e.message + " (open the browser console with F12 for details)", true);
  }
  setBusy(false);
  input.focus();
}

sendBtn.addEventListener("click", () => send(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.textContent)));
document.getElementById("reset").addEventListener("click", async () => {
  try { await fetch("/reset", {method:"POST"}); } catch(e) {}
  location.reload();
});
</script>
</body>
</html>
